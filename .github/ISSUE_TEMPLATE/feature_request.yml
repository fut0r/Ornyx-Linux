name: Feature request
description: Propose a change to Ornyx Linux.
body:
  - type: textarea
    id: need
    attributes:
      label: Problem
      description: Describe the need and the affected editions.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior you want.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Success criteria
      description: Describe how a contributor could verify the outcome.
    validations:
      required: true
