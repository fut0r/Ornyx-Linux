<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>Inter Variable</family>
    <accept><family>SF Pro Display</family><family>Amiri</family><family>Kawkab Mono</family></accept>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter Variable</family><family>SF Pro Display</family><family>Amiri</family><family>Kawkab Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>JetBrains Mono</family>
    <accept><family>Kawkab Mono</family><family>Amiri</family></accept>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Kawkab Mono</family></prefer>
  </alias>
</fontconfig>
